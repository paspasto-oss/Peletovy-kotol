<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Revízna správa – Spektra</title>

  <!-- Favicon = logo "S" (inline, aby nebol 404) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23e11d48'/%3E%3Cpath d='M44 24c-3-6-11-8-18-5-4 2-6 5-6 8 0 4 3 6 8 7l5 1c4 1 6 2 6 4 0 3-4 5-9 5-5 0-9-2-11-5l-4 3c3 5 9 8 16 8 9 0 16-4 16-11 0-5-4-8-11-10l-4-1c-4-1-5-2-5-4 0-2 2-3 4-4 5-2 11 0 13 4l4-2z' fill='white'/%3E%3C/svg%3E" />

  <!-- Tailwind (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html2pdf -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <!-- React 18 UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <style>
    /* Tmavé pozadie aplikácie */
    body{background:#0b0f13;color:#e5e7eb;font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif;}
    /* jednoduché helper "component" triedy (používam aj Tailwind utily) */
    .card{ @apply bg-neutral-900/40 border border-neutral-800 rounded-2xl; }
    .btn{ @apply px-3 py-2 rounded-lg font-medium; }
    .input{ @apply w-full px-3 py-2 rounded-lg bg-neutral-800 border border-neutral-700 text-neutral-100; }

    /* === A4 plátno (vždy presná 1 strana) === */
    #pdf-wrapper{
      background:#fff; width:210mm; height:297mm;
      margin:0 auto; overflow:hidden; display:flex; justify-content:center; align-items:flex-start;
    }
    .sheet{ width:210mm; height:297mm; background:#fff; color:#000; box-sizing:border-box; }
    /* tabuľka vo výstupe */
    #pdf-sheet table{ table-layout:fixed; width:100%; border-collapse:collapse; }
    #pdf-sheet th,#pdf-sheet td{ border:1px solid #e5e7eb; padding:8px; font-size:11px; color:#000; word-break:break-word; white-space:pre-wrap; }

    /* kompakt mód len pri exporte */
    #pdf-sheet.pdf-compact{ font-size:11px; line-height:1.14; }
    #pdf-sheet.pdf-compact .metric-label{ font-size:10px; }
    #pdf-sheet.pdf-compact .metric-value{ font-size:11px; }
    #pdf-sheet.pdf-compact .sign-box{ height:90px !important; }
  </style>
</head>
<body class="min-h-screen">
  <div id="root"></div>
  <script src="./app.js"></script>
</body>
</html>
